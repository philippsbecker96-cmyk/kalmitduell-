<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#1d3328">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kalmit-Duell Fernbedienung</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--forest:#1d3328;--pine:#2f5a44;--sand:#b5523b;--paper:#f6f3ea;--muted:#c9d6cc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--forest);color:var(--paper);font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column;padding:16px;gap:14px;min-height:100%}
h1{margin:0;font-size:22px} #st{color:var(--muted);font-size:15px;min-height:1.3em}
button{flex:1;border:0;border-radius:22px;font:700 34px system-ui,sans-serif;color:var(--paper);background:var(--pine);touch-action:manipulation}
button:active{filter:brightness(1.3);transform:scale(.98)} button:disabled{opacity:.35}
#bStart{background:#2b8a3e;flex:.7} #bPause{background:var(--sand)} #bWeiter{background:#1c7ed6}
#wl{font-size:13px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<h1>Kalmit-Duell 📱</h1>
<div id="st">Verbinde…</div>
<button id="bStart" disabled>▶ Start</button>
<button id="bPause" disabled>⏸ Pause</button>
<button id="bWeiter" disabled>▶ Weiter</button>
<div id="wl"></div>
<script>
/* Fernbedienung: verbindet sich mit dem Peer des PCs (Code aus dem QR-Code) und schickt nur Befehle */
const PREFIX='kalmit-duell-v3-', code=location.hash.slice(1).toUpperCase(), $=id=>document.getElementById(id);
let conn=null, wakeLock=null, wlOk=false;
const st=t=>$('st').textContent=t, btns=on=>['bStart','bPause','bWeiter'].forEach(id=>$(id).disabled=!on);
// Display an lassen: beim ersten Tippen anfragen, nach Rückkehr in die Seite neu holen
async function wakeOn(){ try{ if('wakeLock' in navigator && !wakeLock && document.visibilityState==='visible'){ wakeLock=await navigator.wakeLock.request('screen'); wlOk=true; $('wl').textContent='Display bleibt an ✓'; wakeLock.addEventListener('release',()=>{ wakeLock=null; }); } }catch(e){ if(!wlOk) $('wl').textContent='Display-Sperre konnte nicht verhindert werden.'; } }
if(!('wakeLock' in navigator)) $('wl').textContent='Dieses Handy kann das Display nicht wach halten – Auto-Sperre ggf. selbst abschalten.';
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && wlOk) wakeOn(); });
document.addEventListener('pointerdown',wakeOn);
function cmd(a){ wakeOn(); if(conn&&conn.open){ conn.send({t:'rc',a}); if(navigator.vibrate) navigator.vibrate(40); } }
$('bStart').onclick=()=>cmd('start'); $('bPause').onclick=()=>cmd('pause'); $('bWeiter').onclick=()=>cmd('resume');
if(!code) st('Kein Code – bitte den QR-Code am PC scannen.');
else if(!window.Peer) st('Online-Modul nicht geladen – Internetverbindung prüfen.');
else { const peer=new Peer();
  peer.on('open',()=>{ conn=peer.connect(PREFIX+'r-'+code,{reliable:true});
    conn.on('open',()=>{ st('Verbunden ✓ ('+code+')'); btns(true); });
    conn.on('close',()=>{ st('Verbindung getrennt – Seite neu laden.'); btns(false); }); });
  peer.on('error',e=>{ st(e.type==='peer-unavailable'?'PC nicht gefunden – QR-Code neu scannen.':'Fehler: '+e.type+' – Seite neu laden.'); btns(false); }); }
</script>
</body>
</html>
